<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>8-Ball Pool</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 45%,#1b2330,#090b10 75%)}
canvas{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
#reset{position:fixed;right:14px;bottom:12px;padding:6px 12px;font:12px system-ui,sans-serif;color:#cfd6e4;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:14px;opacity:.55;cursor:pointer}
#reset:hover,#reset:focus-visible{opacity:1}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>
<button id="reset">Reset Rack</button>
<script>
'use strict';
// ---------- constants (world units: playfield is W x H, origin at its top-left) ----------
const W = 1000, H = 500, R = 11.25, C = 18, FR = 52, CG = 34, SG = 24;
const TW = W + 2 * FR, TH = H + 2 * FR;
const MAXV = 2600, DT = 1 / 120, E_BALL = 0.96, E_RAIL = 0.75, DRAG = 0.6, ROLL = 40;
const COLORS = ['#f7f4ea', '#f5c518', '#1e4fc2', '#d8262c', '#5b2a91', '#f07a1a', '#14804a', '#7a1c22', '#141414'];
const POCKETS = [[4, 4, 24], [W / 2, -10, 20], [W - 4, 4, 24], [4, H - 4, 24], [W / 2, H + 10, 20], [W - 4, H - 4, 24]]
  .map(([x, y, r]) => ({ x, y, r }));
// cushion polygons: [back-a, nose-a, nose-b, back-b]; the other four are mirrors
const mirX = p => p.map(([x, y]) => [W - x, y]), mirY = p => p.map(([x, y]) => [x, H - y]);
const TL = [[CG - C, -C], [CG, 0], [W / 2 - SG, 0], [W / 2 - SG + 6, -C]];
const LF = [[-C, CG - C], [0, CG], [0, H - CG], [-C, H - CG + C]];
const CUSHIONS = [TL, mirX(TL), mirY(TL), mirY(mirX(TL)), LF, mirX(LF)];
const SEGS = CUSHIONS.flatMap(p => [[p[0], p[1]], [p[1], p[2]], [p[2], p[3]]]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- game state ----------
let balls, sinking, potted, player, state, inHand, aim = 0, power = 0, shotPower = 0, strikeT = 0;
let shotPots, scratch, msg, drag = null, hover = null;
const cue = () => balls.find(b => b.n === 0);
const ball = (n, x, y) => ({ n, x, y, vx: 0, vy: 0, m: [1, 0, 0, 0, 1, 0, 0, 0, 1] });

// roll without slipping: rotate the ball's orientation about the in-plane axis square to its travel
function spin(b, dx, dy) {
  const d = Math.hypot(dx, dy);
  if (!d) return;
  const kx = -dy / d, ky = dx / d, a = d / R, c = Math.cos(a), s = Math.sin(a), t = 1 - c, m = b.m;
  const r = [c + t * kx * kx, t * kx * ky, s * ky, t * kx * ky, c + t * ky * ky, -s * kx, -s * ky, s * kx, c], o = [];
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
    o[i * 3 + j] = r[i * 3] * m[j] + r[i * 3 + 1] * m[3 + j] + r[i * 3 + 2] * m[6 + j];
  b.m = o;
}

function rack() {
  balls = [ball(0, W / 4, H / 2)];
  const order = [1, 9, 2, 10, 8, 3, 11, 4, 12, 5, 6, 13, 14, 7, 15]; // 8 centre, back corners differ
  const d = 2 * R + 0.3;
  for (let r = 0, k = 0; r < 5; r++) for (let i = 0; i <= r; i++, k++)
    balls.push(ball(order[k], W * 0.75 + r * d * Math.sqrt(3) / 2, H / 2 + (i - r / 2) * d));
  sinking = []; potted = []; player = 1; state = 'aim'; inHand = false; power = 0;
  shotPots = 0; scratch = false; msg = ''; drag = null; aim = 0;
}

// ---------- physics ----------
function step(dt) {
  let vmax = 0;
  for (const b of balls) vmax = Math.max(vmax, Math.hypot(b.vx, b.vy));
  const n = Math.max(1, Math.ceil(vmax * dt / (0.4 * R))), h = dt / n; // sub-steps: no tunneling
  for (let s = 0; s < n; s++) {
    for (const b of balls) {
      b.x += b.vx * h; b.y += b.vy * h; spin(b, b.vx * h, b.vy * h);
      const v = Math.hypot(b.vx, b.vy);
      if (v > 0) { const nv = Math.max(0, v - (DRAG * v + ROLL) * h) / v; b.vx *= nv; b.vy *= nv; }
    }
    for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], b = balls[j], dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 >= 4 * R * R || d2 === 0) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = (2 * R - d) / 2;
      a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) { const k = -(1 + E_BALL) * rv / 2; a.vx -= k * nx; a.vy -= k * ny; b.vx += k * nx; b.vy += k * ny; }
    }
    for (const b of balls) for (const [[ax, ay], [bx, by]] of SEGS) {
      const ex = bx - ax, ey = by - ay;
      const t = clamp(((b.x - ax) * ex + (b.y - ay) * ey) / (ex * ex + ey * ey), 0, 1);
      const dx = b.x - ax - ex * t, dy = b.y - ay - ey * t, d2 = dx * dx + dy * dy;
      if (d2 >= R * R || d2 === 0) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
      b.x += nx * (R - d); b.y += ny * (R - d);
      if (vn < 0) { b.vx -= (1 + E_RAIL) * vn * nx; b.vy -= (1 + E_RAIL) * vn * ny; }
    }
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i], d2 = p => (b.x - p.x) ** 2 + (b.y - p.y) ** 2;
      let p = POCKETS.find(p => d2(p) < p.r * p.r);
      if (!p && (b.x < -R || b.x > W + R || b.y < -R || b.y > H + R)) // safety net: never lose a ball
        p = POCKETS.reduce((m, q) => d2(q) < d2(m) ? q : m);
      if (!p) continue;
      balls.splice(i, 1);
      const v = Math.hypot(b.vx, b.vy), f = Math.min(1, 900 / (v || 1));
      sinking.push({ n: b.n, x: b.x, y: b.y, vx: b.vx * f, vy: b.vy * f, m: b.m, p, t: 0 });
      if (b.n) { potted.push(b.n); shotPots++; } else scratch = true;
    }
  }
}

const isFree = (x, y) => balls.every(b => b.n === 0 || Math.hypot(b.x - x, b.y - y) >= 2 * R);

function settle() {
  if (potted.includes(8)) {
    state = 'over';
    msg = potted.length === 15 && !scratch ? `Table cleared — Player ${player} wins!` : `8-ball foul — Player ${player} loses`;
    return;
  }
  if (scratch) {
    let y = H / 2;
    for (let k = 1; !isFree(W / 4, y); k++) y = H / 2 + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * R;
    balls.push(ball(0, W / 4, y));
    inHand = true;
  }
  if (scratch || !shotPots) player = 3 - player;
  state = 'aim';
}

function fire() {
  const c = cue();
  c.vx = Math.cos(aim) * MAXV * shotPower; c.vy = Math.sin(aim) * MAXV * shotPower;
  shotPots = 0; scratch = false; inHand = false; state = 'moving';
}

// ---------- self-check: open index.html?test ----------
function selfTest() {
  const fail = m => { throw new Error(m); };
  for (let k = 0; k < 20; k++) {
    rack();
    const a = (k - 10) * 0.02, c = cue();
    c.vx = Math.cos(a) * MAXV; c.vy = Math.sin(a) * MAXV;
    let ke = Infinity, steps = 0;
    do {
      step(DT);
      const e = balls.reduce((s, b) => s + b.vx * b.vx + b.vy * b.vy, 0);
      if (!(e <= ke * (1 + 1e-9) + 1e-6)) fail(`energy rose or NaN (break ${k}, step ${steps})`);
      ke = e;
      if (++steps > 120 * 60) fail(`balls never stopped (break ${k})`);
    } while (ke > 0);
    if (balls.length + potted.length + (scratch ? 1 : 0) !== 16) fail(`ball lost (break ${k})`);
    balls.forEach((b, i) => {
      if (b.x < -2 || b.x > W + 2 || b.y < -2 || b.y > H + 2) fail(`ball ${b.n} off table (break ${k})`);
      for (let j = i + 1; j < balls.length; j++)
        if (Math.hypot(b.x - balls[j].x, b.y - balls[j].y) < 2 * R - 0.5) fail(`balls overlap (break ${k})`);
    });
  }
}

// ---------- rendering ----------
// WebGL canvas (below): table texture, ball shadows, balls shaded per pixel on the GPU.
// 2D canvas (above): HUD, power slider, aim guide, cue, messages.
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const glc = document.getElementById('gl'), gl = glc.getContext('webgl', { antialias: false });
let dpr = 1, cw = 0, ch = 0, sc = 1, ox = 0, oy = 0, sl = {};
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };
const RGB = COLORS.map(c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16) / 255));
const IDENT = [1, 0, 0, 0, 1, 0, 0, 0, 1];

const VS = `attribute vec2 a; uniform vec4 u_rect; varying vec2 v;
void main(){ v = a; gl_Position = vec4(u_rect.xy + a * u_rect.zw, 0., 1.); }`;
// ball surface: number spots at the two poles (body +-z), stripe band around body y, one red dot on the cue ball
const FS = `precision highp float;
varying vec2 v; uniform int u_mode; uniform sampler2D u_tex; uniform mat3 u_m; uniform vec3 u_col;
uniform float u_n, u_px, u_alpha, u_dark; uniform vec3 u_clip;
const float SPOT = 0.47; const vec3 WHITE = vec3(.97, .96, .92);
void main(){
  if (u_mode == 0) { gl_FragColor = texture2D(u_tex, vec2(v.x * .5 + .5, .5 - v.y * .5)); return; }   // table
  float r = length(v);
  if (u_mode == 1) { gl_FragColor = vec4(0., 0., 0., .5 * smoothstep(1., .45, r) * u_alpha); return; } // shadow
  vec2 P = vec2(v.x, -v.y);
  vec3 p = vec3(P, sqrt(max(0., 1. - r * r)));   // view-space point on the sphere
  vec3 q = u_m * p;                              // -> body space (u_m is the transposed orientation)
  float w = 1.5 / u_px;                          // ~1.5 px in unit-sphere space, for edge smoothing
  vec2 uv = clamp(vec2(q.z > 0. ? q.x : -q.x, q.y) / SPOT * .5 + .5, .02, .98);
  vec3 num = texture2D(u_tex, (vec2(mod(u_n, 4.), floor(u_n / 4.)) + uv) / 4.).rgb;
  vec3 c = u_col;
  if (u_n < .5) c = mix(WHITE, vec3(.85, .15, .17), smoothstep(.983, .987, q.z));
  else {
    if (u_n > 8.5) c = mix(c, WHITE, smoothstep(.55 - w, .55 + w, abs(q.y)));
    c = mix(c, num, smoothstep(SPOT + w, SPOT - w, length(q.xy)));
  }
  vec3 L = normalize(vec3(-.45, -.55, .7)), Hv = normalize(L + vec3(0., 0., 1.));
  vec3 col = c * (.36 + .74 * max(dot(p, L), 0.)) + vec3(.75 * pow(max(dot(p, Hv), 0.), 70.));
  float rim = 1. - smoothstep(u_clip.z - 1., u_clip.z + 1., distance(gl_FragCoord.xy, u_clip.xy)); // hidden under the pocket rim
  gl_FragColor = vec4(col * u_dark, clamp((1. - r) * u_px, 0., 1.) * u_alpha * rim);
}`;
const U = {};
let tableTex, atlasTex;
function initGL() {
  const prog = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, FS]]) {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    gl.attachShader(prog, sh);
  }
  gl.linkProgram(prog); gl.useProgram(prog);
  for (const n of ['rect', 'mode', 'tex', 'm', 'col', 'n', 'px', 'alpha', 'dark', 'clip']) U[n] = gl.getUniformLocation(prog, 'u_' + n);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enable(gl.BLEND); // straight-alpha source onto a premultiplied canvas
  gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  // 4x4 atlas of number spots, tile n at (n % 4, n / 4 | 0)
  const TS = 64, at = mk(4 * TS, 4 * TS), g = at.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 4 * TS, 4 * TS);
  g.fillStyle = '#111'; g.font = `bold ${TS * 0.62}px Arial,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let n = 1; n < 16; n++) g.fillText(n, (n % 4 + 0.5) * TS, ((n / 4 | 0) + 0.54) * TS);
  atlasTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, atlasTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, at);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  tableTex = gl.createTexture();
}
// x, y, half-sizes in CSS px
function quad(mode, x, y, hw, hh) {
  gl.uniform1i(U.mode, mode);
  gl.uniform4f(U.rect, x / cw * 2 - 1, 1 - y / ch * 2, hw / cw * 2, hh / ch * 2);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function glBall(n, m, x, y, r, alpha = 1, dark = 1, clip = [0, 0, 1e9]) {
  gl.uniformMatrix3fv(U.m, false, m); // row-major array read as column-major = transpose, as the shader wants
  gl.uniform3fv(U.col, RGB[n > 8 ? n - 8 : n]);
  gl.uniform1f(U.n, n); gl.uniform1f(U.px, r * dpr); gl.uniform1f(U.alpha, alpha);
  gl.uniform1f(U.dark, dark); gl.uniform3fv(U.clip, clip);
  quad(2, x, y, r, r);
}

function makeTable(k) {
  const c = mk(TW * k, TH * k), g = c.getContext('2d'), rnd = a => (Math.random() - 0.5) * a;
  g.setTransform(k, 0, 0, k, FR * k, FR * k);
  // wood frame + grain + metal pocket castings (clipped to the rounded frame)
  const wood = g.createLinearGradient(0, -FR, 0, H + FR);
  wood.addColorStop(0, '#8f3426'); wood.addColorStop(0.5, '#5c1c15'); wood.addColorStop(1, '#7e2a1f');
  g.beginPath(); g.roundRect(-FR, -FR, TW, TH, 28); g.fillStyle = wood; g.fill();
  g.save(); g.clip();
  g.strokeStyle = 'rgba(0,0,0,.13)'; g.lineWidth = 0.8;
  for (let i = 0; i < 80; i++) {
    const y = -FR + Math.random() * TH;
    g.beginPath(); g.moveTo(-FR, y); g.bezierCurveTo(W * 0.3, y + rnd(12), W * 0.7, y + rnd(12), W + FR, y + rnd(6)); g.stroke();
  }
  const metal = (x0, y0, x1, y1) => {
    const m = g.createLinearGradient(x0, y0, x1, y1);
    m.addColorStop(0, '#f6f8fa'); m.addColorStop(0.45, '#98a2ad'); m.addColorStop(0.6, '#e4e8ec'); m.addColorStop(1, '#6c7580');
    return m;
  };
  const plates = [[-FR, -FR], [W + FR - 78, -FR], [-FR, H + FR - 78], [W + FR - 78, H + FR - 78]];
  for (const [x, y] of plates) {
    g.fillStyle = metal(x, y, x + 78, y + 78); g.beginPath(); g.roundRect(x, y, 78, 78, 12); g.fill();
  }
  for (const y of [-FR, H + C]) {
    g.fillStyle = metal(W / 2 - 38, y, W / 2 + 38, y + FR - C); g.beginPath(); g.roundRect(W / 2 - 38, y - 6, 76, FR - C + 12, 8); g.fill();
  }
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = 1.5; g.beginPath(); g.roundRect(-FR + 1, -FR + 1, TW - 2, TH - 2, 27); g.stroke();
  // rail sights
  g.fillStyle = '#e3e9f7';
  const dot = (x, y) => { g.beginPath(); g.arc(x, y, 2.6, 0, 7); g.fill(); };
  for (const k8 of [1, 2, 3, 5, 6, 7]) { dot(W * k8 / 8, -C - 17); dot(W * k8 / 8, H + C + 17); }
  for (const k4 of [1, 2, 3]) { dot(-C - 17, H * k4 / 4); dot(W + C + 17, H * k4 / 4); }
  // felt: base, grain noise, vignette, rail shadows
  const fx = -C, fy = -C, fw = W + 2 * C, fh = H + 2 * C;
  g.fillStyle = '#2f80ba'; g.fillRect(fx, fy, fw, fh);
  const nz = mk(128, 128), ng = nz.getContext('2d'), id = ng.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) {
    id.data[i] = id.data[i + 1] = id.data[i + 2] = Math.random() < 0.5 ? 0 : 255; id.data[i + 3] = Math.random() * 26;
  }
  ng.putImageData(id, 0, 0);
  g.fillStyle = g.createPattern(nz, 'repeat'); g.fillRect(fx, fy, fw, fh);
  const vg = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.62); // lit centre, darker towards the rails
  vg.addColorStop(0, 'rgba(165,225,255,.42)'); vg.addColorStop(0.55, 'rgba(120,190,240,0)'); vg.addColorStop(1, 'rgba(3,18,48,.45)');
  g.fillStyle = vg; g.fillRect(fx, fy, fw, fh);
  for (const [x, y] of plates) { // the casting wraps behind each corner pocket, so no felt shows past the hole
    g.fillStyle = metal(x, y, x + 78, y + 78); g.fillRect(x < 0 ? -C : W + C - 22, y < 0 ? -C : H + C - 22, 22, 22);
  }
  // head string + spots
  g.strokeStyle = 'rgba(190,230,255,.5)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(W / 4, 0); g.lineTo(W / 4, H); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.arc(W * 0.75, H / 2, 3, 0, 7); g.fill();
  g.beginPath(); g.arc(W / 4, H / 2, 2, 0, 7); g.fill();
  // pockets with inner depth
  for (const p of POCKETS) {
    const r = p.r, pg = g.createRadialGradient(p.x, p.y, r * 0.3, p.x, p.y, r);
    pg.addColorStop(0, '#000'); pg.addColorStop(0.75, '#070707'); pg.addColorStop(1, '#2b2b2b');
    g.fillStyle = pg; g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.7)'; g.lineWidth = 1.5; g.stroke();
  }
  // raised cushions: bright bevel at the nose, flat top, and a soft shadow cast onto the felt.
  // The pocket mouths get no shadow strip or outline, so the felt runs smoothly into each hole.
  for (const pass of [0, 1]) for (const p of CUSHIONS) {
    const horiz = p[1][1] === p[2][1], s = horiz ? Math.sign(p[0][1] - p[1][1]) : Math.sign(p[0][0] - p[1][0]); // nose -> back, square to the rail
    const cgd = horiz ? g.createLinearGradient(0, p[1][1], 0, p[1][1] + s * C) : g.createLinearGradient(p[1][0], 0, p[1][0] + s * C, 0);
    cgd.addColorStop(0, '#a5dcfa'); cgd.addColorStop(0.2, '#62b0e4'); cgd.addColorStop(0.3, '#4494d0'); cgd.addColorStop(1, '#2f78b3');
    g.save();
    if (!pass) { // pass 0: shadow only, clipped to the playfield so the pocket mouths stay clean felt
      g.beginPath(); g.rect(0, 0, W, H); g.clip();
      g.shadowColor = 'rgba(0,12,36,.6)'; g.shadowBlur = 10 * k; // shadowBlur is in device px
    }
    g.fillStyle = cgd; g.beginPath(); p.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fill();
    g.restore();
    if (!pass) continue;
    g.lineWidth = 1; g.lineCap = 'round';
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.moveTo(...p[1]); g.lineTo(...p[2]); g.stroke();
    g.strokeStyle = 'rgba(0,10,30,.4)'; g.beginPath(); g.moveTo(...p[0]); g.lineTo(...p[3]); g.stroke();
  }
  return c;
}

function layout() {
  dpr = window.devicePixelRatio || 1; cw = innerWidth; ch = innerHeight;
  cv.width = glc.width = Math.round(cw * dpr); cv.height = glc.height = Math.round(ch * dpr);
  const L = 84, T = 64, M = 14;
  sc = Math.max(0.1, Math.min((cw - L - M) / TW, (ch - T - M) / TH));
  ox = L + (cw - L - M - TW * sc) / 2 + FR * sc; oy = T + (ch - T - M - TH * sc) / 2 + FR * sc;
  sl = { x: ox - FR * sc - 52, y: oy + H * sc * 0.1, w: 22, h: H * sc * 0.8 };
  gl.viewport(0, 0, glc.width, glc.height);
  const k = Math.min(sc * dpr, (gl.getParameter(gl.MAX_TEXTURE_SIZE) - 1) / TW);
  gl.bindTexture(gl.TEXTURE_2D, tableTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, makeTable(k));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

function drawGuide(c) {
  const dx = Math.cos(aim), dy = Math.sin(aim);
  let t = Infinity, hit = null;
  for (const b of balls) {
    if (!b.n) continue;
    const mx = b.x - c.x, my = b.y - c.y, p = mx * dx + my * dy;
    if (p <= 0) continue;
    const q = mx * mx + my * my - p * p;
    if (q < 4 * R * R) { const th = p - Math.sqrt(4 * R * R - q); if (th < t) { t = th; hit = b; } }
  }
  if (!hit) t = Math.max(0, Math.min(dx > 0 ? (W - R - c.x) / dx : dx < 0 ? (R - c.x) / dx : Infinity,
                                     dy > 0 ? (H - R - c.y) / dy : dy < 0 ? (R - c.y) / dy : Infinity));
  const gx = c.x + dx * t, gy = c.y + dy * t;
  const line = (x0, y0, x1, y1) => { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); };
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2.6; ctx.lineCap = ctx.lineJoin = 'round';
  if (t > R) line(c.x + dx * R, c.y + dy * R, gx, gy);
  ctx.beginPath(); ctx.arc(gx, gy, R - 1.3, 0, 7); ctx.stroke();
  if (hit) {
    const nx = (hit.x - gx) / (2 * R), ny = (hit.y - gy) / (2 * R), cs = dx * nx + dy * ny;
    const tl = 28 + 70 * cs;
    line(hit.x + nx * R, hit.y + ny * R, hit.x + nx * (R + tl), hit.y + ny * (R + tl)); // target ball path
    const tx = dx - cs * nx, ty = dy - cs * ny, tn = Math.hypot(tx, ty);
    if (tn > 0.02) line(gx + tx / tn * R, gy + ty / tn * R, gx + tx / tn * (R + 18 + 60 * tn), gy + ty / tn * (R + 18 + 60 * tn)); // cue ball path
  } else {
    const rx = (gx <= R + 0.01 || gx >= W - R - 0.01) ? -dx : dx, ry = (gy <= R + 0.01 || gy >= H - R - 0.01) ? -dy : dy;
    line(gx, gy, gx + rx * 45, gy + ry * 45);
  }
}

function drawCue(c, pull) {
  for (const shadow of [true, false]) {
    ctx.save();
    ctx.translate(c.x + (shadow ? 4 : 0), c.y + (shadow ? 6 : 0)); ctx.rotate(aim);
    const x0 = -(R + 5 + pull);
    const part = (a, b, wa, wb, fill) => {
      ctx.fillStyle = shadow ? 'rgba(0,0,0,.25)' : fill;
      ctx.beginPath(); ctx.moveTo(x0 - a, -wa / 2); ctx.lineTo(x0 - b, -wb / 2); ctx.lineTo(x0 - b, wb / 2); ctx.lineTo(x0 - a, wa / 2); ctx.fill();
    };
    const shaft = ctx.createLinearGradient(x0 - 11, 0, x0 - 260, 0);
    shaft.addColorStop(0, '#ecd09a'); shaft.addColorStop(1, '#c4914f');
    part(0, 3, 4.2, 4.3, '#3f7fd6');        // chalked tip
    part(3, 11, 4.3, 4.6, '#f2efe6');       // ferrule
    part(11, 260, 4.6, 7.6, shaft);         // shaft
    part(260, 450, 7.6, 10, '#2b1710');     // butt
    if (!shadow) {
      part(260, 265, 7.6, 7.7, '#c9a24a'); part(330, 333, 8.5, 8.5, '#c9a24a');
      part(340, 420, 8.6, 9.6, '#15100e'); part(423, 426, 9.7, 9.7, '#c9a24a'); part(442, 450, 9.9, 10, '#0a0a0a');
      part(11, 440, 1.2, 2, 'rgba(255,255,255,.22)'); // gloss
    }
    ctx.restore();
  }
}

const HUD_R = 12;
const hudY = () => oy - FR * sc - 34;
const hudX = n => n < 8 ? ox - FR * sc + 26 + (n - 1) * (2 * HUD_R + 6) : ox + (W + FR) * sc - 26 - (15 - n) * (2 * HUD_R + 6);
function drawHud() {
  const x0 = ox - FR * sc, w = TW * sc, y = hudY();
  ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.beginPath(); ctx.roundRect(x0, y - 22, w, 44, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1;
  for (let n = 1; n < 16; n++) if (n !== 8 && !potted.includes(n)) { ctx.beginPath(); ctx.arc(hudX(n), y, HUD_R - 1, 0, 7); ctx.stroke(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.font = '600 16px system-ui,sans-serif';
  ctx.fillText(`Player ${player}`, x0 + w / 2, inHand ? y - 7 : y);
  if (inHand) { ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.font = '11px system-ui,sans-serif'; ctx.fillText('Ball in hand — drag the cue ball', x0 + w / 2, y + 10); }
  // power slider
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.roundRect(sl.x, sl.y, sl.w, sl.h, 11); ctx.fill();
  ctx.save(); ctx.clip();
  const pg = ctx.createLinearGradient(0, sl.y, 0, sl.y + sl.h);
  pg.addColorStop(0, '#3ecf6e'); pg.addColorStop(0.55, '#f2c230'); pg.addColorStop(1, '#e0382c');
  ctx.fillStyle = pg; ctx.fillRect(sl.x, sl.y, sl.w, sl.h * power);
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#e9edf5'; ctx.beginPath(); ctx.roundRect(sl.x - 6, sl.y + sl.h * power - 5, sl.w + 12, 10, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '10px system-ui,sans-serif'; ctx.fillText('POWER', sl.x + sl.w / 2, sl.y - 14);
}

function draw() {
  // --- WebGL layer ---
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindTexture(gl.TEXTURE_2D, tableTex);
  quad(0, ox + W * sc / 2, oy + H * sc / 2, TW * sc / 2, TH * sc / 2);
  gl.bindTexture(gl.TEXTURE_2D, atlasTex);
  const r = R * sc, sx = x => ox + x * sc, sy = y => oy + y * sc;
  for (const s of sinking) {
    const f = s.t / SINK, e = f * f * (3 - 2 * f);
    const clipR = (s.p.r - 1 + 2 * R * (1 - Math.min(1, f * 2.5))) * sc; // rim closes over the ball as it drops
    glBall(s.n, s.m, sx(s.x), sy(s.y), r * (1 - 0.28 * e), 1 - clamp((f - 0.7) / 0.3, 0, 1), 1 - 0.7 * e,
      [sx(s.p.x) * dpr, (ch - sy(s.p.y)) * dpr, clipR * dpr]);
  }
  gl.uniform1f(U.alpha, 1);
  for (const b of balls) quad(1, sx(b.x + 2.5), sy(b.y + 3.5), r * 1.25, r * 1.25);
  for (const b of balls) glBall(b.n, b.m, sx(b.x), sy(b.y), r, 1);
  for (const n of potted) if (n !== 8) glBall(n, IDENT, hudX(n), hudY(), HUD_R, 1);
  // --- 2D overlay ---
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  drawHud();
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
  const c = cue();
  if (c && state === 'aim') {
    if (inHand) { ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(c.x, c.y, R * 1.8, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
    if (!drag || drag.t !== 'place') { drawGuide(c); drawCue(c, power * 120); }
  } else if (c && state === 'strike') drawCue(c, shotPower * 120 * (1 - strikeT / 0.08) - 4);
  if (msg) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const mx = ox + W * sc / 2, my = oy + H * sc / 2;
    ctx.fillStyle = 'rgba(8,10,14,.82)'; ctx.beginPath(); ctx.roundRect(mx - 210, my - 44, 420, 88, 16); ctx.fill();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.font = '600 20px system-ui,sans-serif'; ctx.fillText(msg, mx, my - 10);
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '13px system-ui,sans-serif'; ctx.fillText('Click to rack again', mx, my + 18);
  }
}

// ---------- input (pointer events: mouse + touch) ----------
const toWorld = e => ({ x: (e.clientX - ox) / sc, y: (e.clientY - oy) / sc });
const inSlider = e => e.clientX > sl.x - 16 && e.clientX < sl.x + sl.w + 16 && e.clientY > sl.y - 16 && e.clientY < sl.y + sl.h + 16;
const sliderPower = e => { power = clamp((e.clientY - sl.y) / sl.h, 0, 1); };
function aimAt(p) { const c = cue(); if (c && Math.hypot(p.x - c.x, p.y - c.y) > 1) aim = Math.atan2(p.y - c.y, p.x - c.x); }

cv.addEventListener('pointerdown', e => {
  if (state === 'over') { rack(); return; }
  if (state !== 'aim') return;
  cv.setPointerCapture(e.pointerId);
  const p = toWorld(e), c = cue(), mouse = e.pointerType === 'mouse';
  if (inSlider(e)) { drag = { t: 'slider' }; sliderPower(e); }
  else if (inHand && Math.hypot(p.x - c.x, p.y - c.y) < R * (mouse ? 1.8 : 3)) drag = { t: 'place' };
  else if (mouse) drag = { t: 'power', x: p.x, y: p.y };   // aim is locked while pulling back
  else { drag = { t: 'aim' }; aimAt(p); }                  // touch: drag to aim, slider to shoot
});
cv.addEventListener('pointermove', e => {
  const p = toWorld(e);
  hover = e.pointerType === 'mouse' ? p : null;
  if (state !== 'aim' || !drag) return;
  if (drag.t === 'slider') sliderPower(e);
  else if (drag.t === 'power') power = clamp(((drag.x - p.x) * Math.cos(aim) + (drag.y - p.y) * Math.sin(aim)) / 220, 0, 1);
  else if (drag.t === 'aim') aimAt(p);
  else {
    const x = clamp(p.x, R, W - R), y = clamp(p.y, R, H - R), c = cue();
    if (isFree(x, y)) { c.x = x; c.y = y; }
  }
});
function release(shoot) {
  if (shoot && drag && state === 'aim' && power > 0.03 && (drag.t === 'slider' || drag.t === 'power')) {
    shotPower = power; strikeT = 0; state = 'strike';
  }
  power = 0; drag = null;
}
cv.addEventListener('pointerup', () => release(true));
cv.addEventListener('pointercancel', () => release(false));
document.getElementById('reset').addEventListener('click', rack);
addEventListener('resize', layout);

// ---------- main loop ----------
let last = 0;
const SINK = 0.5; // seconds a potted ball takes to drop out of sight
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (state === 'strike' && (strikeT += dt) >= 0.08) fire();
  if (state === 'moving') step(dt); // one step per displayed frame (sub-stepped inside): no beat against the refresh rate
  for (const s of sinking) {
    s.t += dt;
    s.vx += ((s.p.x - s.x) * 300 - s.vx * 14) * dt; s.vy += ((s.p.y - s.y) * 300 - s.vy * 14) * dt; // pulled down the hole
    const mx = s.vx * dt, my = s.vy * dt;
    s.x += mx; s.y += my; spin(s, mx, my);
    const dx = s.x - s.p.x, dy = s.y - s.p.y, d = Math.hypot(dx, dy), lim = s.p.r - 1 - R * 0.72, vr = (s.vx * dx + s.vy * dy) / (d || 1);
    if (d > lim && vr > 0) { // hits the back of the pocket
      s.x = s.p.x + dx / d * lim; s.y = s.p.y + dy / d * lim;
      s.vx -= 1.3 * vr * dx / d; s.vy -= 1.3 * vr * dy / d;
    }
  }
  sinking = sinking.filter(s => s.t < SINK);
  if (state === 'moving' && !sinking.length && balls.every(b => !b.vx && !b.vy)) settle();
  if (state === 'aim' && !drag && hover) aimAt(hover);
  draw();
  requestAnimationFrame(frame);
}

if (location.search.includes('test')) {
  try { selfTest(); document.title = 'TEST PASS'; } catch (err) { document.title = 'TEST FAIL: ' + err.message; }
  console.log(document.title);
}
if (!gl) document.body.textContent = 'This game needs WebGL.';
else { initGL(); rack(); layout(); requestAnimationFrame(frame); }
// shortcut: no webglcontextlost handling, reload the page if the GPU context is ever dropped
</script>
</body>
</html>
